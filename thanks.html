<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Submitting!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --slate-50: #F8FAFC;
            --white: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--white);
            color: var(--text-dark);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .thanks-content {
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInUp 0.6s ease;
        }

        .success-icon-circle {
            width: 96px;
            height: 96px;
            background-color: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10B981;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .redirecting-text {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        /* Loading Dots Animation */
        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .loading-dots span {
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>
    <div class="thanks-content">
        <div class="success-icon-circle">
            <svg viewBox="0 0 24 24" width="64" height="64" stroke="#10B981" stroke-width="3" fill="none">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Thank You!</h1>
        <p>Your application details have been submitted. Our IT recruitment coordinators will review your resume and experience level to schedule an interview.</p>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p class="redirecting-text">Validating details, please do not close this window...</p>
    </div>

    <script>
        window.addEventListener('beforeunload', (event) => {
            // Prevent close action and trigger standard confirmation dialog
            event.preventDefault();
            const message = 'Changes you made may not be saved.';
            event.returnValue = message;
            return message;
        });
    </script>
</body>
</html>
